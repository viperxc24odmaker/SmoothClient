name: Build Smooth Client (Fabric 1.21.11)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ vulkan, sodium ]   # Basic (VulkanMod) + Full (Sodium) from one push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build (${{ matrix.flavor }})
        run: gradle build -Pflavor=${{ matrix.flavor }} --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SmoothClient-${{ matrix.flavor }}-1.21.11
          path: build/libs/SmoothClient-${{ matrix.flavor }}-*.jar
          if-no-files-found: error
